# Kawaii hyprlock preset. Soft pastel pink/lavender, rounded input field,
# fixed palette so it stays consistent regardless of whatever wallpaper is
# active on the rest of the desktop.

$pink = rgba(FF8FABFF)
$pink_dim = rgba(FF8FABAA)
$lavender = rgba(C9A7EBFF)
$cream = rgba(FFF3F8F2)

background {
    monitor =
    color = rgba(2A1F2EF2)
    path = $BACKGROUND_PATH
    blur_size = 6
    blur_passes = 3
    noise = 0.01
    contrast = 1.0
    brightness = 0.85
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

# DAY
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A")"
    color = $pink
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d") ⋆｡°✩"
    color = $lavender
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = $cream
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $lavender
    inner_color = rgba(2A1F2ECC)
    font_color = $cream
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>uwu enter password...</i>
    hide_input = false
    rounding = -1
    check_color = $pink
    fail_color = rgba(FF6B9DFF)
    fail_text = <i>nyo (｡•́︿•̀｡) <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, 80
    halign = center
    valign = bottom
}

# USER
label {
    monitor =
    text = 🎀 $USER
    color = $pink_dim
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}

# BATTERY
label {
    monitor =
    text = cmd[update:5000] $BATTERY_ICON
    color = $pink_dim
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -1%, 1%
    halign = right
    valign = bottom
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = $pink_dim
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -2%, 1%
    halign = right
    valign = bottom
}
