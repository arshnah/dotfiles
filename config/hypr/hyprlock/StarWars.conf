# A long time ago, in a config far, far away...
# Star Wars themed hyprlock preset. Opening-crawl gold on black, no wallbash
# dependency — colors are fixed so the look stays consistent regardless of
# whatever wallpaper/theme is active on the rest of the desktop.

$resolve.font=Anurati|https://font.download/dl/font/anurati.zip

$crawl = rgba(FFE81FFF)
$crawl_dim = rgba(FFE81FAA)
$imperial = rgba(0A0A0BF2)

background {
    monitor =
    color = $imperial
    path = $BACKGROUND_PATH
    blur_size = 2
    blur_passes = 2
    noise = 0.02
    contrast = 1.1
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

# DAY
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A" | tr '[:lower:]' '[:upper:]')"
    color = $crawl
    font_size = 90
    font_family = Anurati
    position = 0, 110
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d")"
    color = $crawl_dim
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = $crawl
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 220, 50
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = 0
    outer_color = $crawl
    inner_color = rgba(0A0A0BCC)
    font_color = $crawl
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Enter the access code...</i>
    hide_input = false
    rounding = 2
    check_color = $crawl
    fail_color = rgba(FF3B30FF)
    fail_text = <i>Access denied <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, 80
    halign = center
    valign = bottom
}

# USER
label {
    monitor =
    text =   $USER
    color = $crawl_dim
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}

# BATTERY
label {
    monitor =
    text = cmd[update:5000] $BATTERY_ICON
    color = $crawl_dim
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -1%, 1%
    halign = right
    valign = bottom
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = $crawl_dim
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -2%, 1%
    halign = right
    valign = bottom
}
