"$schema" = 'https://starship.rs/config-schema.json'

# Minimal flat prompt, Tokyo Night palette. Shows only what's relevant
# (git, languages, docker, duration) instead of always-on powerline blocks.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration\
$time
$character"""

palette = "tokyonight"

[palettes.tokyonight]
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"
grey = "#565f89"
fg = "#c0caf5"

[username]
style_user = "grey"
style_root = "red bold"
format = "[$user]($style)@"
disabled = false
show_always = false

[hostname]
ssh_only = true
style = "grey"
format = "[$hostname]($style) "

[directory]
style = "blue bold"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = ".../"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "magenta"
format = "[on](grey) [$symbol$branch]($style) "

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style)) '
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
style = "red"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2000
style = "yellow"
format = "took [$duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "grey"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
