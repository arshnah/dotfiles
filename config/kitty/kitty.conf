include hyde.conf

# Override: use an installed Nerd Font (hyde.conf's CaskaydiaCove isn't installed)
font_family Maple Mono NF

# hyde.conf leaves background_opacity commented out, so kitty renders fully
# opaque even though Hyprland's blur/opacity rules expect a punched-through
# background to blur.
background_opacity 0.90
background_blur 20

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Don't prompt to confirm closing a window (e.g. via SUPER + Q) even with a
# process still running inside.
confirm_os_window_close 0

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no
